<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Musica</title>

    <link rel="stylesheet" href="style/cadastrostyle.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

</head>
<body>
    <div class="header"  id="header">  
        <div class="container" >
            <div class="title">
            <a href="home.html">MUSiCA</a>
            </div>
        </div>
    </div>

    <div class="tela1" >
        <div class="box" >
            <div class="box1" >
                <div class="bemvindo" >
                    <span>bem-vindo!</span>
                </div>
                <div class="nota" >
                    <img src="assets/nota1.png" alt="">
                </div>
            </div>
            <div class="box2" >
                <div class="criarconta" >
                    <span>criar conta:</span>
                </div>

                <div class="inputs">
                    <div class="nomeemail" >
                        <div class="input" >
                            <span>nome:</span>
                            <input placeholder="insira seu nome"  type="text" id="input_nome">
                        </div>

                        <div class="input" >
                            <span>email:</span>
                            <input placeholder="insira seu email"  type="text" id="input_email">
                        </div>
                    </div>

                    <div  class="senhaconfirm" >
                        <div class="input" >
                            <span>senha:</span>
                            <input placeholder="insira sua senha"  type="text" id="input_senha">
                        </div>

                        <div class="input" >
                            <span>confirmar senha:</span>
                            <input placeholder="confirme sua senha"  type="text" id="input_confirm">
                        </div>
                    </div>
                </div>

                <div class="containerButton">
                    <div class="buttonCadastro">
                        <span>cadastre-se</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
