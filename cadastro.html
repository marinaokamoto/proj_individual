<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Musica</title>

    <link rel="stylesheet" href="style/cadastrostyle.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

</head>
<body>
    <div class="header"  id="header">  
        <div class="container" >
            <div class="title">
            <a href="home.html">MUSiCA</a>
            </div>
        </div>
    </div>

    <div class="tela1" >
        <div><img src="assets/xadrezE.png" alt=""></div>
        <div class="box" >
            <div class="box1" >
                <div class="bemvindo" >
                    <span>bem-vindo!</span>
                </div>
                <div class="nota" >
                    <img src="assets/nota1.png" alt="">
                </div>
            </div>
            <div class="box2" >
                <div class="criarconta" >
                    <span>criar conta:</span>
                </div>

                <div class="inputs">
                    <div class="nomeemail" >
                        <div class="input" >
                            <span>nome:</span>
                            <input placeholder="insira seu nome"  type="text" id="input_nome">

                            <div id="div_analisarNome" class="validacao"></div>
                        </div>

                        <div class="input" >
                            <span>email:</span>
                            <input oninput="analisarEmail()" placeholder="insira seu email"  type="text" id="input_email">

                            <div id="div_analisarEmail" class="validacao"></div>

                        </div>
                    </div>

                    <div  class="senhaconfirm" >
                        <div class="input" >
                            <span>senha:</span>
                            <input oninput="analisarSenha()" placeholder="insira sua senha"  type="password" id="input_senha">

                            <div id="div_analisarSenha" class="validacao" ></div>
                        </div>

                        <div class="input" >
                            <span>confirmar senha:</span>
                            <input oninput="confirmSenha()" placeholder="confirme sua senha"  type="password" id="input_confirm">

                            <div id="div_confirmSenha" class="validacao"></div>
                        </div>
                    </div>
                </div>

                <div class="containerButton">
                    <div class="buttonCadastro">
                        <a onclick="cadastrar()">cadastre-se</a>
                    </div>
                    <span><a href="login.html">já possui conta? <b>faça login!</b></a></span>
                </div>
            </div>
        </div>
        <div><img src="assets/xadrezD.png" alt=""></div>
    </div>
</body>
</html>

<script>
    // lista dos parâmetros
    var listaCaracteres = ['!','@','#','$', '%', '&', '*'];
    var listaNumeros = ['1','2','3','4','5','6','7','8','9','0'];
    
    // lista de validações
    var emailValido = false;
    var senhaValida1 = false;
    var senhaValida2 = false;
    var confirmValida = false;

    function analisarEmail() {
        var email = input_email.value;
        
        if (!email.includes('@')) {
            div_analisarEmail.innerHTML = 
            `email inválido`;
        } else {
            div_analisarEmail.innerHTML = '';
            emailValido = true;
        }
        
    }
    
    function analisarSenha() {
        var senha = input_senha.value;
        var senhaTamanho = senha.length;
        
        for (var cont=0; cont<listaNumeros.length; cont++) {
            if (senha.includes(listaNumeros[cont])) {
                senhaValida1 = true;
                div_analisarSenha.innerHTML = '';
            }  
        }

        if (!senhaValida1){
            div_analisarSenha.innerHTML = 
            `senha inválida`
        }

        for (var cont2=0; cont2<listaCaracteres.length; cont2++) {
            if (senha.includes(listaCaracteres[cont2])) {
                senhaValida2 = true;
                div_confirmSenha.innerHTML = '';
            } 
        }
        
        if (!senhaValida2) {
            div_analisarSenha.innerHTML = 
            `senha inválida`
        }
    }
    
    function confirmSenha() {
        var senha = input_senha.value;
        var confirm = input_confirm.value;

        if (senha != confirm) {
            div_confirmSenha.innerHTML = 
            `senha inválida`
        } else {
            confirmValida = true;
            div_confirmSenha.innerHTML = '';
        }
    }
    
    function cadastrar() {
        if (emailValido && senhaValida1 && senhaValida2 && confirmValida) {
            alert('Cadastro Efetuado!');
            window.location.href ='login.html';
        } else {
            alert('Cadastro Inválido! Confira os campos');
        }
    }
</script>
